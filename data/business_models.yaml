  - id: usage_based
    label: Usage-based
    description: Pay-per-use or consumption-based pricing

  - id: freemium
    label: Freemium
    description: Free tier + paid upgrade

  - id: consulting_retainer
    label: Consulting Retainer
    description: Monthly retainer for ongoing services

  - id: project_fee
    label: Project Fee
