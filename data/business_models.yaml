  - id: training_workshop
    label: Training & Workshop
    description: Live or recorded training

  - id: licensing
    label: Licensing
    description: License to use IP or software

  - id: marketplace
    label: Marketplace
    description: Transaction fee on platform activity

  - id: audit
    label: Audit & Assessment
    description: One-time diagnostic deliverable
