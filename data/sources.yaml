# Sources for automated AI business blueprint discovery
# discover_new_examples.py reads github/hn type sources with search_query.
# Web sources are for manual review.
#
# Status: active | paused | candidate
# Frequency: daily | weekly

sources:

  # ── GitHub API searches ───────────────────────────────────────────────────────

  github_ai_business_tools:
    type: github
    description: AI business frameworks, canvases, and planning tools
    search_query: "ai business model OR business canvas ai OR go-to-market ai language:python"
    frequency: daily
    status: active
    added_at: "2026-05-01"

  github_lean_gtm:
    type: github
    description: Lean startup, GTM playbooks, and launch frameworks
    search_query: "lean startup framework OR go to market playbook OR launch checklist ai"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  github_ai_product_ops:
    type: github
    description: AI product operations and business process automation
    search_query: "ai product management OR business process ai OR ops automation llm stars:>30"
    frequency: daily
    status: active
    added_at: "2026-06-01"

  github_awesome_business:
    type: github
    description: Awesome business and startup resource lists
    search_query: "awesome entrepreneurship OR awesome business tools OR awesome startup playbook"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  # ── Hacker News ───────────────────────────────────────────────────────────────

  hn_show_business_tool:
    type: hn
    description: Show HN — business tools and AI workflows
    search_query: "Show HN business tool AI"
    frequency: daily
    status: active
    added_at: "2026-05-01"

  hn_ask_business_ai:
    type: hn
    description: Ask HN — building a business with AI
    search_query: "Ask HN building business AI"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  hn_founder_playbooks:
    type: hn
    description: HN threads on founder playbooks and launch strategies
    search_query: "founder playbook launch strategy AI startup"
    frequency: weekly
    status: active
    added_at: "2026-06-01"

  # ── Web sources (manual review) ───────────────────────────────────────────────

  indie_hackers_interviews:
    type: web
    description: Indie Hackers interviews — real business blueprints from founders
    url: "https://www.indiehackers.com/interviews/page/1"
    frequency: weekly
    status: active
    added_at: "2026-05-01"
    notes: Best qualitative source for real-world business blueprints

  firstround_review:
    type: web
    description: First Round Review — deep-dive founder playbooks
    url: "https://review.firstround.com/library/"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  lenny_newsletter:
    type: web
    description: Lenny Rachitsky newsletter — product and growth playbooks
    url: "https://www.lennysnewsletter.com/archive"
    frequency: weekly
    status: active
    added_at: "2026-06-01"

  strategyzer_blog:
    type: web
    description: Strategyzer — business model innovation and canvases
    url: "https://www.strategyzer.com/blog"
    frequency: weekly
    status: paused
    added_at: "2026-05-26"
    notes: Paused — infrequent updates; check manually once a month
