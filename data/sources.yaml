# Sources used for automated business blueprint discovery
# Fields:
#   type: github | hn | reddit | producthunt | web | newsletter
#   status: active | candidate | paused
#   search_query: used directly in GitHub/HN API calls
#   url: for web type sources
#   frequency: daily | weekly
#   added_at: ISO date
sources:
  github_ai_business:
    type: github
    description: GitHub repos — AI business frameworks and guides
    search_query: "ai business framework OR business model canvas ai OR llm business"
    frequency: daily
    status: active
    added_at: "2026-05-01"

  github_lean_startup:
    type: github
    description: Lean startup and business blueprint tools
    search_query: "lean startup OR business blueprint OR go-to-market ai"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  github_awesome_business:
    type: github
    description: Awesome business and entrepreneurship lists
    search_query: "awesome business OR awesome entrepreneurship OR awesome startup tools"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  hn_show_business_tool:
