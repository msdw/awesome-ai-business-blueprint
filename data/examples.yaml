# Real AI business examples — for educational reference
examples:
  - id: ai_document_processing_service
    name: AI Document Processing Service
    description: >
      A productized service that processes client documents (invoices, contracts, reports)
      using AI extraction and returns structured JSON or CSV data.
    category: ai_services
    industries:
      - finance
      - legal
      - operations
    target_users:
      - consultant
    blueprint_stage_relevance:
      - step_05
      - step_06
      - step_12
    business_model: project_fee
    outcome: >
      First 3 clients were found via cold email to accounting firms.
      Charged $500-2000 per project depending on document volume.
      Reached $5k/month within 6 months.
    lessons:
      - Manual concierge first — automated extraction came in month 2
      - Price per project, not per document, to reduce friction
      - Compliance notes required for financial document processing
    compliance_notes: >
      Financial document processing may involve sensitive data.
      Ensure data handling agreements are in place.
      Do not store client data beyond the project scope.
    scoring:
      pain_intensity: 9
      willingness_to_pay: 9
      ai_fit: 9
      implementation_complexity: 6
      distribution_difficulty: 6
      compliance_risk: 7
      operational_complexity: 5
      differentiation_potential: 6
    tags:
      - document_processing
      - b2b
      - automation
    source: public
    status: accepted

