  - id: ai_rfp_response_assistant
    name: AI RFP Response Assistant
    description: >
      A tool or internal service that helps B2B sales and pre-sales teams draft
      answers to RFP questions by retrieving relevant content from previous proposals,
      product documentation, and approved company knowledge.
    category: ai_saas
    industries:
      - software_dev
      - consulting
    target_users:
      - b2b_sales_rep
      - pre_sales_engineer
    blueprint_stage_relevance:
      - step_01
      - step_04
      - step_06
    business_model: subscription_saas
    outcome: >
      Products such as Loopio and RFPIO (now Responsive) have built substantial recurring
      revenue in this category. Implementation packages targeting mid-market firms
      are also viable. First pilots typically reduce RFP response time by 40-60%
      according to public customer testimonials.
    lessons:
      - Human review before submission is non-negotiable — AI drafts reduce effort, not accountability
      - Source citations in answers increase buyer trust significantly
      - Start with a RAG-over-existing-proposals approach before building custom fine-tuning
    compliance_notes: >
      RFP documents often contain confidential procurement information.
      Ensure data is not shared with external model providers without a DPA.
      Add access controls by document sensitivity.
    scoring:
      pain_intensity: 9
      willingness_to_pay: 8
      ai_fit: 9
      implementation_complexity: 5
      distribution_difficulty: 4
      compliance_risk: 4
      operational_complexity: 4
      differentiation_potential: 6
    tags:
      - rag
      - b2b_sales
      - document_generation
    source: public
    status: accepted

  - id: ai_support_agent_smbs
    name: AI Customer Support Agent for SMBs
    description: >
      A configurable AI support agent that handles tier-1 customer questions for
      small and medium businesses, trained on the company's product documentation,
      FAQs, and past support tickets.
    category: ai_saas
    industries:
      - e_commerce
      - software_dev
      - services
    target_users:
      - small_business_owner
      - support_manager
    blueprint_stage_relevance:
      - step_01
      - step_05
      - step_07
    business_model: subscription_saas
    outcome: >
      Platforms such as Intercom and Freshdesk have added AI tiers in this space.
      Indie implementations targeting a single vertical (e.g., Shopify stores or
      SaaS help desks) have found product-market fit at $99-299 per month.
      Typical deflection rate of 40-70% of tier-1 tickets reported in public case studies.
    lessons:
      - Niche verticals (e.g., restaurant SaaS, e-commerce) convert better than horizontal positioning
      - Human escalation path must be visible and functional before launch
      - Training on real tickets, not only documentation, significantly improves response quality
    compliance_notes: >
      Customer support data may contain personal information.
      Ensure GDPR/CCPA compliance for data storage and retention.
      Disclose AI involvement to end users where required by applicable law.
    scoring:
      pain_intensity: 8
      willingness_to_pay: 7
      ai_fit: 9
      implementation_complexity: 5
      distribution_difficulty: 4
      compliance_risk: 4
      operational_complexity: 4
      differentiation_potential: 5
    tags:
      - customer_support
      - automation
      - smb
    source: public
    status: accepted

  - id: ai_internal_knowledge_base
    name: AI Internal Knowledge Base Assistant
    description: >
      An internal search and Q&A assistant that allows employees to query company
      documentation, policies, wikis, and past project outputs using natural language.
      Built on RAG over the organization's existing knowledge repositories.
    category: ai_services
    industries:
      - consulting
      - software_dev
      - operations
    target_users:
      - operations_manager
      - knowledge_manager
      - hr_manager
    blueprint_stage_relevance:
      - step_04
      - step_06
      - step_08
    business_model: implementation_package
    outcome: >
      Multiple documented implementations show 20-40% reduction in time spent
      searching for internal information. Implementation packages for mid-market
      firms typically range from 5,000 to 25,000 EUR depending on document volume
      and integration complexity.
    lessons:
      - Data quality and document freshness are the primary determinants of output quality
      - Source citations with links are essential for user trust
      - Start with one department's documentation before expanding company-wide
    compliance_notes: >
      Internal documents may contain confidential, personal, or legally privileged information.
      Restrict access by role and department.
      Audit logs are recommended for compliance-sensitive organizations.
    scoring:
