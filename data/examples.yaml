  - id: ai_weekly_reporting_automation
    name: AI Weekly Reporting Automation
    description: >
      An automated pipeline that pulls data from business tools (CRM, analytics,
      finance), generates structured narrative summaries of key metrics, and
      distributes weekly business reports to leadership teams.
    category: ai_services
    industries:
      - operations
      - finance
      - software_dev
    target_users:
      - operations_manager
      - startup_founder
      - finance_manager
    blueprint_stage_relevance:
      - step_04
      - step_07
      - step_12
    business_model: productized_service
    outcome: >
      Automation of weekly reporting has been documented at companies of all sizes.
      Productized implementations for SMBs and scale-ups charge 500-2,000 EUR per month.
      Typical time savings: 3-6 hours per week of analyst or founder time.
    lessons:
      - Data connectivity (API access to tools) is the primary implementation challenge
      - Narrative framing of metrics is more useful to leadership than raw numbers
      - Anomaly detection and flagging of week-over-week changes adds significant value
    compliance_notes: >
      Financial and operational data may be commercially sensitive.
      Ensure data is not shared externally without appropriate controls.
