  - id: ai_customer_feedback_analysis
    name: AI Customer Feedback Analysis Service
    description: >
      A service that processes customer feedback from surveys, support tickets,
      reviews, and NPS responses using AI to identify recurring themes, sentiment
      patterns, and actionable product or service improvement signals.
    category: ai_services
    industries:
      - software_dev
      - e_commerce
      - services
    target_users:
      - product_manager
      - customer_success_manager
      - startup_founder
    blueprint_stage_relevance:
      - step_04
      - step_14
      - step_15
    business_model: productized_service
    outcome: >
      Products such as Dovetail, Productboard, and Thematic operate in adjacent spaces.
      Productized analysis services for early-stage companies charge 500-2,500 EUR per
      engagement or per month. Common output: a structured insight report with top
      5 themes, representative quotes, and recommended product actions.
    lessons:
      - Verbatim customer quotes are more persuasive to product teams than summaries alone
      - Combining multiple feedback channels (NPS + support + reviews) increases signal quality
      - Monthly cadence reports are easier to sell than one-time analyses
    compliance_notes: >
      Customer feedback may contain personal information and sensitive complaints.
      Anonymize data before processing where possible.
      Ensure data processing agreements are in place for SaaS customer data.
    scoring:
