  - id: ai_meeting_followup_service
    name: AI Meeting Follow-up Service for Consultants
    description: >
      A productized service that takes meeting recordings or transcripts and
      automatically generates structured meeting summaries, action items, and
      follow-up email drafts for consultants and professional services teams.
    category: ai_services
    industries:
      - consulting
      - professional_services
    target_users:
      - consultant
      - project_manager
    blueprint_stage_relevance:
      - step_06
      - step_09
      - step_12
    business_model: productized_service
    outcome: >
      Tools such as Otter.ai, Fireflies, and Notion AI have expanded into this space.
      Productized service versions targeting consulting firms charge 200-800 EUR per
      month per team. Consultants report saving 1-2 hours per meeting on follow-up tasks.
    lessons:
      - Meeting notes are most valuable when delivered within 30 minutes of the meeting ending
      - Action item extraction accuracy improves significantly with domain-specific prompting
      - A simple email draft reduces the final editing burden more than a summary alone
